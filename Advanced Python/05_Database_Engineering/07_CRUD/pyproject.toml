[project]
name = "research-crud"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "fastapi>=0.111", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
