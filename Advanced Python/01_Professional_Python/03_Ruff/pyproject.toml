[project]
name = "pipeline-qc"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle / pyflakes
    "I",                  # isort
    "N",                  # pep8-naming
    "UP",                 # pyupgrade
    "B",                  # flake8-bugbear
    "C4",                 # flake8-comprehensions
    "SIM",                # flake8-simplify
    "S",                   # flake8-bandit (security)
    "RUF",                 # ruff-specific rules
    "PL",                   # pylint subset
    "PT",                     # pytest style
]
ignore = [
    "PLR0913",  # allow domain constructors with several fields
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]  # allow asserts and magic values in tests

[tool.ruff.lint.isort]
known-first-party = ["pipeline_qc"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
