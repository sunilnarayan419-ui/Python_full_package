[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioseqkit"
version = "1.2.0"
description = "Utilities for validating and summarizing biological sequence data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Platform Engineering", email = "platform-eng@example.com" }]
keywords = ["bioinformatics", "sequencing", "fasta", "fastq"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
cli = ["click>=8.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.11", "ruff>=0.6", "black>=24.0"]

[project.urls]
Homepage = "https://example.com/bioseqkit"
Repository = "https://example.com/bioseqkit.git"
Issues = "https://example.com/bioseqkit/issues"

[project.scripts]
bioseqkit = "bioseqkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bioseqkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bioseqkit --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bioseqkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]
